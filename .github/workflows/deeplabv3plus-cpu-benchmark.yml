name: DeepLabV3+ CPU benchmark

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps used for the benchmark"
        required: false
        default: "3"
  push:
    paths:
      - "scripts/benchmark_deeplabv3plus.py"
      - ".github/workflows/deeplabv3plus-cpu-benchmark.yml"

permissions:
  contents: read

jobs:
  cpu-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Verify runner has no CUDA GPU
        run: |
          python - <<'PY'
          import torch
          print("PyTorch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          print("CPU threads:", torch.get_num_threads())
          PY

      - name: Run DeepLabV3+ forward/backward benchmark
        run: |
          STEPS="${{ github.event.inputs.steps || '3' }}"
          python scripts/benchmark_deeplabv3plus.py --steps "$STEPS" --batch-size 1 --height 288 --width 512

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: deeplabv3plus-cpu-benchmark
          path: benchmark-results/cpu_benchmark.json
          if-no-files-found: error
          retention-days: 30
