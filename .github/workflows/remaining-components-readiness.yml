name: Remaining components readiness (Mask R-CNN and environment metadata)

on:
  push:
    paths:
      - "scripts/validate_remaining_components.py"
      - ".github/workflows/remaining-components-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remaining-components-readiness
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pillow
      - name: Validate BDD100K instance-mask decoder, Mask R-CNN and metadata join
        run: python scripts/validate_remaining_components.py
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-components-readiness
          path: component-readiness/
          if-no-files-found: warn
          retention-days: 30
