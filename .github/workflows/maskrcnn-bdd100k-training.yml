name: Mask R-CNN BDD100K real-data training (CPU)

on:
  push:
    paths:
      - "scripts/train_maskrcnn_bdd100k.py"
      - "scripts/validate_remaining_components.py"
      - ".github/workflows/maskrcnn-bdd100k-training.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maskrcnn-bdd100k-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      TRAIN_SAMPLES: "100"
      VAL_SAMPLES: "30"
      EPOCHS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and remote dataset reader
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pillow requests remotezip
      - name: Verify instance-mask decoder and Mask R-CNN implementation
        run: python scripts/validate_remaining_components.py
      - name: Train and evaluate on real BDD100K instance masks
        run: python scripts/train_maskrcnn_bdd100k.py
      - name: Upload model, checkpoints, metrics, and sampled data report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maskrcnn-bdd100k-100train-30val-2epochs
          path: maskrcnn-results/
          if-no-files-found: warn
          retention-days: 30
